<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>PW Safe – Passwort-Generator</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    /* ── THEMEN ─────────────────────────────────── */
    [data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; --accent: #34d399;
      --text: #f1f5f9; --muted: #94a3b8; --danger: #f87171;
      --input-bg: #0b1220; --border: #334155;
    }
    [data-theme="light"] {
      --bg: #f1f5f9; --card: #ffffff; --accent: #047857;
      --text: #0f172a; --muted: #64748b; --danger: #dc2626;
      --input-bg: #f8fafc; --border: #cbd5e1;
    }
    /* ── GRUNDLAGEN ─────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 440px; }
    /* ── HEADER ─────────────────────────────────── */
    .header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    h1 { font-size: 1.4rem; }
    .sub { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
    /* ── THEME-SWITCH ───────────────────────────── */
    .theme-toggle {
      position: relative; width: 56px; height: 30px; flex-shrink: 0;
    }
    .theme-toggle input { opacity: 0; width: 0; height: 0; }
    .theme-slider {
      position: absolute; inset: 0; background: #475569; border-radius: 999px; transition: .25s; cursor: pointer;
    }
    .theme-slider::before {
      content: ""; position: absolute; width: 24px; height: 24px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px; transition: .25s;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .theme-toggle input:checked + .theme-slider { background: #0ea5e9; }
    .theme-toggle input:checked + .theme-slider::before { transform: translateX(26px); }
    .theme-emojis {
      position: absolute; width: 100%; display: flex; justify-content: space-between;
      pointer-events: none; font-size: 14px; top: 4px; padding: 0 5px;
    }
    /* ── KARTEN ─────────────────────────────────── */
    .card {
      background: var(--card); border-radius: 16px; padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12); margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    /* ── PASSWORT-FELD ──────────────────────────── */
    .pw-row { display: flex; gap: 8px; align-items: stretch; }
    #pw {
      flex: 1; font-family: ui-monospace, monospace; font-size: 1.05rem;
      background: var(--input-bg); color: var(--accent); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; word-break: break-all; min-height: 54px;
      cursor: pointer;
    }
    button {
      border: none; border-radius: 10px; padding: 12px 16px; font-size: 1rem;
      cursor: pointer; background: var(--border); color: var(--text);
      touch-action: manipulation; transition: background .15s;
    }
    button.primary { background: var(--accent); font-weight: 700; }
    [data-theme="dark"] button.primary { color: #052e22; }
    [data-theme="light"] button.primary { color: #fff; }
    button:active { transform: scale(.97); opacity: .85; }
    /* ── AKTIONEN ───────────────────────────────── */
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    /* ── OPTIONEN ───────────────────────────────── */
    .len-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: .95rem; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    label.row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; font-size: .95rem; border-bottom: 1px solid var(--border);
    }
    /* ── OPTIONEN-SWITCHES ──────────────────────── */
    .switch { position: relative; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: .2s;
    }
    .slider::before {
      content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px; transition: .2s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(20px); }
    /* ── STÄRKE-METER ───────────────────────────── */
    .meter { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-top: 14px; }
    .meter > div { height: 100%; width: 0; transition: width .3s, background .3s; }
    .strength-text { font-size: .8rem; color: var(--muted); margin-top: 6px; }
    /* ── INSTALL & TOAST ────────────────────────── */
    #install { display: none; width: 100%; margin-top: 4px; }
    .toast {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(80px);
      background: var(--accent); padding: 10px 20px; border-radius: 999px;
      font-weight: 600; opacity: 0; transition: .25s; pointer-events: none;
    }
    [data-theme="dark"] .toast { color: #052e22; }
    [data-theme="light"] .toast { color: #fff; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .copy-hint { text-align: center; font-size: .75rem; color: var(--muted); margin-top: 8px; }
    /* ── PASSPHRASE ─────────────────────────────── */
    .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; background: transparent; color: var(--muted); font-size: .9rem; padding: 8px;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }
    [data-theme="dark"] .tab-btn.active { color: #052e22; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .word-list {
      font-family: ui-monospace, monospace; font-size: 1.05rem;
      background: var(--input-bg); color: var(--accent); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; word-break: break-all; min-height: 54px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<main>
  <!-- HEADER -->
  <div class="header">
    <h1>🔐 PW Safe</h1>
    <label class="theme-toggle" title="Dark / Light">
      <input type="checkbox" id="themeSwitch" checked />
      <div class="theme-emojis"><span>☀️</span><span>🌙</span></div>
      <span class="theme-slider"></span>
    </label>
  </div>
  <p class="sub">Sichere Passwörter – lokal, offline, ohne Server.</p>

  <!-- TABS -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="pw">Passwort</button>
    <button class="tab-btn" data-tab="phrase">Passphrase</button>
  </div>

  <!-- PASSWORT-GENERATOR -->
  <div class="tab-content active" id="tab-pw">
    <div class="card">
      <div class="pw-row">
        <div id="pw" aria-live="polite"></div>
        <button id="regen" title="Neu erzeugen" aria-label="Neu erzeugen">↻</button>
      </div>
      <div class="actions">
        <button id="copy">📋 Kopieren</button>
        <button id="read">👁 Anzeigen</button>
      </div>
      <div class="meter"><div id="bar"></div></div>
      <div class="strength-text" id="strengthText"></div>
      <div class="copy-hint">Tippe auf das Passwort zum Kopieren</div>
    </div>
    <div class="card">
      <div class="len-label"><span>Länge</span><strong id="lenVal">20</strong></div>
      <input type="range" id="len" min="8" max="64" value="20" />

      <label class="row">Großbuchstaben (A–Z)
        <span class="switch"><input type="checkbox" id="upper" checked><span class="slider"></span></span>
      </label>
      <label class="row">Kleinbuchstaben (a–z)
        <span class="switch"><input type="checkbox" id="lower" checked><span class="slider"></span></span>
      </label>
      <label class="row">Zahlen (0–9)
        <span class="switch"><input type="checkbox" id="digits" checked><span class="slider"></span></span>
      </label>
      <label class="row">Sonderzeichen (!@#$…)
        <span class="switch"><input type="checkbox" id="symbols" checked><span class="slider"></span></span>
      </label>
      <label class="row">Ähnliche Zeichen vermeiden (l1IO0)
        <span class="switch"><input type="checkbox" id="avoidAmbig"><span class="slider"></span></span>
      </label>
    </div>
  </div>

  <!-- PASSPHRASE-GENERATOR -->
  <div class="tab-content" id="tab-phrase">
    <div class="card">
      <div class="pw-row">
        <div class="word-list" id="phrase" aria-live="polite"></div>
        <button id="regenPhrase" title="Neu erzeugen" aria-label="Neu erzeugen">↻</button>
      </div>
      <div class="actions">
        <button id="copyPhrase">📋 Kopieren</button>
        <button id="readPhrase">👁 Anzeigen</button>
      </div>
      <div class="copy-hint">Tippe auf die Passphrase zum Kopieren</div>
    </div>
    <div class="card">
      <div class="len-label"><span>Wörter</span><strong id="wordCountVal">5</strong></div>
      <input type="range" id="wordCount" min="3" max="12" value="5" />

      <label class="row">Trennzeichen einfügen (-)
        <span class="switch"><input type="checkbox" id="useSep" checked><span class="slider"></span></span>
      </label>
      <label class="row">Zahl anhängen (z. B. -7)
        <span class="switch"><input type="checkbox" id="useNum" checked><span class="slider"></span></span>
      </label>
      <label class="row">Großschreibung
        <span class="switch"><input type="checkbox" id="useCap" checked><span class="slider"></span></span>
      </label>
    </div>
  </div>

  <button id="install" class="primary">📲 Als App installieren</button>
</main>

<div class="toast" id="toast">Kopiert!</div>

<script>
  /* ── HILFSFUNKTIONEN ──────────────────────────── */
  const $ = id => document.getElementById(id);

  /* ── THEME ────────────────────────────────────── */
  const saved = localStorage.getItem("pwsafe-theme");
  if (saved) {
    document.documentElement.setAttribute("data-theme", saved);
    $("themeSwitch").checked = saved === "dark";
  }
  $("themeSwitch").addEventListener("change", () => {
    const theme = $("themeSwitch").checked ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("pwsafe-theme", theme);
    document.querySelector('meta[name="theme-color"]').content =
      theme === "dark" ? "#0f172a" : "#f1f5f9";
  });

  /* ── TABS ─────────────────────────────────────── */
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      $("tab-" + btn.dataset.tab).classList.add("active");
    });
  });

  /* ── TOAST ────────────────────────────────────── */
  function showToast(msg) {
    const t = $("toast"); t.textContent = msg || "Kopiert!"; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1500);
  }

  async function copyText(text) {
    if (!text) return;
    await navigator.clipboard.writeText(text);
    showToast();
  }

  /* ═══════════════════════════════════════════════
     PASSWORT-GENERATOR
     ═══════════════════════════════════════════════ */
  const SETS = {
    upper: "ABCDEFGHJKLMNPQRSTUVWXYZ", lower: "abcdefghijkmnopqrstuvwxyz",
    digits: "23456789", symbols: "!@#$%^&*()-_=+[]{};:,.?/"
  };
  const FULL = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", lower: "abcdefghijklmnopqrstuvwxyz",
    digits: "0123456789", symbols: "!@#$%^&*()-_=+[]{};:,.?/"
  };
  let pwCurrent = "", pwRevealed = true;

  function pwPool() {
    const amb = $("avoidAmbig").checked ? SETS : FULL;
    let p = "";
    for (const k of ["upper","lower","digits","symbols"]) if ($(k).checked) p += amb[k];
    return p;
  }

  function pwGenerate() {
    const chars = pwPool();
    if (!chars) { $("pw").textContent = "⚠️ Mindestens eine Option wählen"; return; }
    const len = +$("len").value;
    const vals = new Uint32Array(len);
    crypto.getRandomValues(vals);
    let out = [];
    for (let i = 0; i < len; i++) out.push(chars[vals[i] % chars.length]);
    pwCurrent = out.join("");
    pwRender();
  }

  function pwEntropy() {
    const size = pwPool().length;
    return size ? Math.round($("len").value * Math.log2(size)) : 0;
  }

  function pwRender() {
    $("pw").textContent = pwRevealed ? pwCurrent : "•".repeat(pwCurrent.length || 12);
    const bits = pwEntropy();
    const pct = Math.min(100, bits / 1.28);
    const bar = $("bar");
    bar.style.width = pct + "%";
    bar.style.background = bits < 60 ? "var(--danger)" : bits < 90 ? "#fbbf24" : "var(--accent)";
    $("strengthText").textContent =
      `Stärke: ${bits < 60 ? "Schwach" : bits < 90 ? "Gut" : "Exzellent"} · ~${bits} Bit Entropie`;
  }

  /* ═══════════════════════════════════════════════
     PASSPHRASE-GENERATOR
     ═══════════════════════════════════════════════ */
  // Ausgewählte englische Wörter (OCWP-ähnlich, leicht unterscheidbar)
  const WORDS = [
    "apple","avocado","beach","bedroom","bird","blizzard","book","bottle",
    "bridge","bronze","butter","canyon","castle","cactus","camera","candle",
    "canyon","carpet","cave","celery","cherry","circle","cloud","comet",
    "cookie","copper","corner","cotton","crater","creek","crown","cube",
    "desert","diamond","dollar","donut","dragon","drift","drought","dusk",
    "eagle","earth","ember","engine","envelope","epoch","eraser","event",
    "feather","fence","fever","flame","flask","fossil","fountain","fridge",
    "galaxy","garden","gate","gem","ghost","globe","glow","gorilla",
    "grape","grass","gravel","grove","guardian","guitar","gust","hammer",
    "harbor","hazel","helmet","honey","horizon","hose","hyena","iceberg",
    "igloo","ivory","jacket","jelly","jungle","justice","kernel","kettle",
    "knight","lab","lagoon","lake","lantern","laser","lavender","leaf",
    "lemon","liberty","lighthouse","linen","lion","lizard","loaf","lock",
    "lodge","lagoon","maple","marble","meadow","meteor","microbe","mirror",
    "moon","mountain","moss","mule","nebula","nectar","night","noise",
    "oasis","ocean","olive","orbit","owl","oxygen","pantry","pearl",
    "peninsula","petal","piano","pilot","pine","planet","plasma","plateau",
    "plum","podium","pollen","pony","poppy","prism","puzzle","quartz",
    "queen","question","quilt","rabbit","rainbow","ramp","raven","reed",
    "reef","regal","relic","ridge","river","robin","rocket","rope",
    "ruby","ruins","sail","sandal","sapphire","sauce","saw","scarf",
    "scenic","shadow","shell","shield","shrine","skull","slate","snow",
    "spark","sphere","spice","spire","spray","spring","squirrel","star",
    "steeple","stream","streamer","strife","sugar","summit","sun","swan",
    "sword","tablet","talent","temple","thunder","tiger","tornado","tower",
    "trail","tray","treetop","trio","trophy","tunnel","twilight","turtle",
    "umbrella","unicorn","unity","valley","vapor","vase","vessel","vine",
    "volcano","vortex","voyage","walnut","ward","wave","weather","wharf",
    "whisper","window","wind","wizard","wood","wrench","yacht","yarn",
    "yellow","zenith","zipper","zone"
  ];

  let phraseCurrent = "", phraseRevealed = true;

  function phraseGenerate() {
    const count = +$("wordCount").value;
    const useSep = $("useSep").checked;
    const useNum = $("useNum").checked;
    const useCap = $("useCap").checked;
    const vals = new Uint32Array(count);
    crypto.getRandomValues(vals);
    let words = [];
    for (let i = 0; i < count; i++) {
      let w = WORDS[vals[i] % WORDS.length];
      if (useCap) w = w.charAt(0).toUpperCase() + w.slice(1);
      words.push(w);
    }
    let result = useSep ? words.join("-") : words.join("");
    if (useNum) result += "-" + (Math.floor(Math.random() * 10) + 1);
    phraseCurrent = result;
    phraseRender();
  }

  function phraseRender() {
    $("phrase").textContent = phraseRevealed ? phraseCurrent : "•".repeat(phraseCurrent.length || 20);
  }

  /* ── EVENT-LISTENER ───────────────────────────── */
  // PW
  $("regen").onclick = pwGenerate;
  $("len").oninput = () => { $("lenVal").textContent = $("len").value; pwGenerate(); };
  ["upper","lower","digits","symbols","avoidAmbig"].forEach(id => $(id).onchange = pwGenerate);
  $("read").onclick = () => { pwRevealed = !pwRevealed; pwRender(); };
  $("copy").onclick = () => copyText(pwCurrent);
  $("pw").addEventListener("click", () => copyText(pwCurrent));

  // Phrase
  $("regenPhrase").onclick = phraseGenerate;
  $("wordCount").oninput = () => { $("wordCountVal").textContent = $("wordCount").value; phraseGenerate(); };
  ["useSep","useNum","useCap"].forEach(id => $(id).onchange = phraseGenerate);
  $("readPhrase").onclick = () => { phraseRevealed = !phraseRevealed; phraseRender(); };
  $("copyPhrase").onclick = () => copyText(phraseCurrent);
  $("phrase").addEventListener("click", () => copyText(phraseCurrent));

  /* ── PWA ──────────────────────────────────────── */
  if ("serviceWorker" in navigator)
    navigator.serviceWorker.register("sw.js").catch(() => {});
  let deferred = null;
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferred = e; $("install").style.display = "block";
  });
  $("install").onclick = async () => { deferred?.prompt(); deferred = null; };

  // Start
  pwGenerate();
  phraseGenerate();
</script>
</body>
</html>
